[tool:pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    unit: fast tests of one module, network replaced by httpx.MockTransport
    integration: tests through the HTTP API with real PostgreSQL and Redis
    regression: one test per fixed defect or contract that must not break again
filterwarnings =
    ignore::DeprecationWarning

[mutmut]
paths_to_mutate = app/probe.py,app/services.py
tests_dir = tests/
runner = python -m pytest -x -q -m "unit or regression"
