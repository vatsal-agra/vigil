<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="976" viewBox="0 0 1440 976">
<rect x="0" y="0" width="1440" height="976" rx="0" fill="#F1F3F5"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#FFFFFF"/>
<line x1="0" y1="76" x2="1440" y2="76" stroke="#D7DBE0" stroke-width="1"/>
<text x="48" y="32" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.6">VIGIL / WIREFRAME 03</text>
<text x="48" y="55" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D22" text-anchor="start">Add monitor</text>
<text x="1392" y="47" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B929C" text-anchor="end">Create flow — US-06, US-07</text>
<g transform="translate(0,76)">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F1F3F5"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D7DBE0" stroke-width="1"/><circle cx="52" cy="32" r="5" fill="#3B62D6"/><text x="66" y="37" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1D22" text-anchor="start">Vigil</text><text x="112" y="37" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">WATCH</text><text x="200" y="37" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1D22" text-anchor="start">Monitors</text><text x="280" y="37" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8B929C" text-anchor="start">Incidents</text><text x="362" y="37" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8B929C" text-anchor="start">Status page</text><line x1="200" y1="63" x2="258" y2="63" stroke="#3B62D6" stroke-width="2"/><text x="1310" y="37" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#8B929C" text-anchor="start">demo@vigil</text><circle cx="1388" cy="32" r="14" fill="#E4E7EB"/><rect x="0" y="64" width="1440" height="836" rx="0" fill="#0C1220"/><rect x="0" y="64" width="1440" height="836" fill="#000000" opacity="0.35"/><rect x="420" y="150" width="600" height="620" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1"/><text x="452" y="196" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D22" text-anchor="start">Add a monitor</text><text x="452" y="220" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B929C" text-anchor="start">Vigil starts checking as soon as you save.</text><line x1="420" y1="244" x2="1020" y2="244" stroke="#D7DBE0" stroke-width="1"/><text x="452" y="280" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">NAME</text><rect x="452" y="288" width="536" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="464" y="312.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">Checkout API</text><text x="452" y="364" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">URL TO CHECK</text><rect x="452" y="372" width="536" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="464" y="396.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">https://api.example.com/health</text><text x="452" y="448" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">METHOD</text><rect x="452" y="456" width="250" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="464" y="480.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">GET</text><text x="738" y="448" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">EXPECTED STATUS</text><rect x="738" y="456" width="250" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="750" y="480.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">200</text><text x="452" y="532" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">CHECK EVERY</text><rect x="452" y="540" width="250" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="464" y="564.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">60 seconds</text><rect x="738" y="540" width="250" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><rect x="752" y="552" width="30" height="16" rx="8" fill="#3B62D6"/><circle cx="775" cy="560" r="6" fill="#FFFFFF"/><text x="794" y="565" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">Show on status page</text><line x1="420" y1="690" x2="1020" y2="690" stroke="#D7DBE0" stroke-width="1"/><rect x="842" y="712" width="146" height="42" rx="5" fill="#3B62D6" stroke="#3B62D6" stroke-width="1"/><text x="915.0" y="737.0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start watching</text><rect x="716" y="712" width="110" height="42" rx="5" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1"/><text x="771.0" y="737.0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1D22" text-anchor="middle">Cancel</text><circle cx="140" cy="296" r="9" fill="#3B62D6"/><text x="140" y="300" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="156" y="300" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">Only name and URL are required.</text><text x="156" y="318" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">Everything else has a working default.</text><circle cx="140" cy="376" r="9" fill="#3B62D6"/><text x="140" y="380" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="156" y="380" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">Method and expected status let this cover</text><text x="156" y="398" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">API health endpoints, not just web pages.</text><circle cx="140" cy="456" r="9" fill="#3B62D6"/><text x="140" y="460" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="156" y="460" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">Minimum interval is 30s — enforced by the</text><text x="156" y="478" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">API so a user cannot self-inflict rate limits.</text><circle cx="140" cy="556" r="9" fill="#3B62D6"/><text x="140" y="560" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="156" y="560" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">Toggle controls whether this service appears</text><text x="156" y="578" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#C7CEDA" text-anchor="start">on the public status page.</text>
</g>
</svg>