<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="976" viewBox="0 0 1440 976">
<rect x="0" y="0" width="1440" height="976" rx="0" fill="#F1F3F5"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#FFFFFF"/>
<line x1="0" y1="76" x2="1440" y2="76" stroke="#D7DBE0" stroke-width="1"/>
<text x="48" y="32" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.6">VIGIL / WIREFRAME 01</text>
<text x="48" y="55" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1D22" text-anchor="start">Sign in</text>
<text x="1392" y="47" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B929C" text-anchor="end">Entry point — US-01, US-02</text>
<g transform="translate(0,76)">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F1F3F5"/>
<rect x="470" y="190" width="500" height="480" rx="8" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1"/><circle cx="510" cy="246" r="5" fill="#3B62D6"/><text x="524" y="251" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1A1D22" text-anchor="start">Vigil</text><text x="502" y="288" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.6">KEEP WATCH ON WHAT YOU SHIPPED</text><text x="502" y="332" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">EMAIL</text><rect x="502" y="340" width="436" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="514" y="364.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">you@company.com</text><text x="502" y="416" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" font-weight="500" fill="#8B929C" text-anchor="start" letter-spacing="1.4">PASSWORD</text><rect x="502" y="424" width="436" height="40" rx="5" fill="#FAFBFC" stroke="#D7DBE0" stroke-width="1"/><text x="514" y="448.0" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#4A5058" text-anchor="start">••••••••••••</text><rect x="502" y="496" width="436" height="44" rx="5" fill="#3B62D6" stroke="#3B62D6" stroke-width="1"/><text x="720.0" y="522.0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sign in</text><line x1="502" y1="570" x2="938" y2="570" stroke="#D7DBE0" stroke-width="1"/><text x="720" y="602" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B929C" text-anchor="middle">No account yet?</text><rect x="640" y="618" width="160" height="34" rx="5" fill="#FFFFFF" stroke="#D7DBE0" stroke-width="1"/><text x="720.0" y="639.0" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1A1D22" text-anchor="middle">Create one</text><circle cx="210" cy="296" r="9" fill="#3B62D6"/><text x="210" y="300" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="226" y="300" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">Single field pair. No social login in v1 —</text><text x="226" y="318" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">self-hosted users have no shared identity provider.</text><circle cx="210" cy="376" r="9" fill="#3B62D6"/><text x="210" y="380" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="226" y="380" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">Errors render above the card in the interface</text><text x="226" y="398" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">voice: “Email or password is incorrect.”</text><circle cx="210" cy="456" r="9" fill="#3B62D6"/><text x="210" y="460" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="226" y="460" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">Successful sign-in stores a JWT and redirects</text><text x="226" y="478" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5058" text-anchor="start">to the dashboard. Token TTL is 24 hours.</text>
</g>
</svg>