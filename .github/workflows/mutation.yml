name: Mutation testing

# Mutation testing re-runs the unit suite once per mutant, so it is too slow for
# every pull request. Run it on demand from the Actions tab, and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  mutmut:
    name: mutmut — probe.py and services.py
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
          POSTGRES_DB: vigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigil" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://vigil:vigil@localhost:5432/vigil
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run mutation testing
        run: python -m mutmut run || true
      - name: Results
        run: python -m mutmut results
